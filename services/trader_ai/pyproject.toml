[project]
name = "trader-ai"
version = "0.1.0"
description = "Trading copilot — tape context, briefs, behaviors, spy_lab tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28.1",
  "pydantic>=2.13",
  "python-dotenv>=1.2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[project.scripts]
trader-ai = "trader_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader_ai"]

[tool.hatch.build.targets.wheel.sources]
"src/trader_ai" = "trader_ai"

[tool.uv.sources]
spy-lab = { path = "../spy_lab", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../spy_lab/src"]
