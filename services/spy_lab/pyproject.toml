[project]
name = "spy-lab"
version = "0.1.0"
description = "SPY Edge Factory — Massive flat files + BigQuery research loop"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.5",
  "pydantic>=2.13",
  "python-dotenv>=1.2",
  "google-cloud-bigquery>=3.43",
  "google-cloud-storage>=3.13",
  "pandas>=3.0",
  "pyarrow>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[project.scripts]
spy-lab = "spy_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spy_lab"]

[tool.hatch.build.targets.wheel.sources]
"src/spy_lab" = "spy_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
